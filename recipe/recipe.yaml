schema_version: 1

context:
  version: "2.11.7"
  python_min: "3.10"

package:
  name: ckan
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/ckan/ckan-${{ version }}.tar.gz
  sha256: c34ccf312e55d91c6d1b752d46cb7b2677e4d7e6e601f1c189acc50dd8747c59

build:
  number: 0
  noarch: python
  script: python -m pip install . --no-deps --no-build-isolation -vv
  python:
    entry_points:
      - ckan = ckan.cli.cli:ckan

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - __unix
    - setuptools >=44.1.0
    # Direct runtime requirements from upstream requirements.in.
    - alembic ==1.13.2
    - babel ==2.18.0
    - blinker ==1.9.0
    - certifi >=2026.10.19
    - click ==8.1.7
    - dominate ==2.9.1
    - feedgen ==1.0.0
    - flask ==3.1.3
    - flask-babel ==4.0.0
    - flask-login ==0.6.3
    - flask-session ==0.8.0
    - flask-wtf ==1.2.1
    - greenlet ==3.3.1
    - jinja2 ==3.1.6
    - lxml ==6.1.1
    - markdown ==3.10.2
    - msgspec ==0.20.0
    - nh3 ==0.3.6
    - packaging ==24.1
    - passlib ==1.7.4
    - pglast ==8.4
    - polib ==1.2.0
    - psycopg2 ==2.9.11
    - pyjwt ==2.15.1
    - pyparsing ==3.1.2
    - python-magic ==0.4.27
    - pysolr ==3.11.0
    - python-dateutil ==2.9.0.post0
    - pytz
    - pyyaml ==6.0.1
    - requests ==2.33.0
    - rq ==1.16.2
    - simplejson ==3.19.2
    - sqlalchemy ==1.4.52
    - typing_extensions ==4.12.2
    - tzlocal ==5.2
    - webassets ==2.0
    - werkzeug ==3.1.9
    - watchdog
    - zope.interface ==6.4.post2

tests:
  - package_contents:
      site_packages:
        - ckan/__init__.py
        - ckan/config/deployment.ini_tmpl
        - ckan/templates/base.html
        - ckanext/datastore/backend/postgres.py
  - python:
      python_version: ${{ python_min }}.*
      imports:
        - ckan
        - ckan.cli
        - ckan.lib.helpers
        - ckanext.datastore.backend.postgres
      pip_check: true
  - requirements:
      run:
        - python ${{ python_min }}.*
    files:
      recipe:
        - run_test.py
    script:
      - ckan --help
      - ckan --version
      - ckan generate config ckan.ini
      - python run_test.py

about:
  homepage: https://ckan.org/
  license: AGPL-3.0-or-later
  license_file: LICENSE.txt
  summary: CKAN Software for making open data websites.
  documentation: https://docs.ckan.org/en/2.11/
  repository: https://github.com/ckan/ckan

extra:
  recipe-maintainers:
    - mxr-conda
    - rluria14
    - mwilson8
    - benhuff
    - oblute
    - ndmaxar
